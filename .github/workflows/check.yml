name: 检查语言包与安装器
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n install.sh
      - run: python3 scripts/check_locale.py
      - run: python3 -m unittest discover -s tests -v
